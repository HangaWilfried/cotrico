services:
  postgres:
    image: postgres:17-alpine
    container_name: cotrico-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cotrico
      POSTGRES_USER: cotrico
      POSTGRES_PASSWORD: cotrico
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: